version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptoagent_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptoagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptoagent_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cryptoagent}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptoagent} -d ${POSTGRES_DB:-cryptoagent}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
